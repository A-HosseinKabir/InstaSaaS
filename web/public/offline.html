<!doctype html>
<html lang="fa" dir="rtl">
<head>

<title>آفلاین</title>

<body>
<main>
  <div class="b"><i></i><i></i><i></i></div>
  <h1>اینترنت وصل نیست</h1>

  <button onclick="location.reload()">تلاش دوباره</button>
</main>
</body>
</html>
